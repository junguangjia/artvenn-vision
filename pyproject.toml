[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "artvenn-vision"
version = "0.1.0"
description = "Local image recognition and evidence-based photo grouping for cultural objects"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
mlx = [
  "mlx-vlm==0.7.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "huggingface-hub==1.6.0",
]
raw = ["rawpy==0.27.1"]

[project.scripts]
artvenn-vision = "artvenn_vision.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "mypy==1.15.0", "build==1.2.2.post1"]

[tool.hatch.build.targets.wheel]
packages = ["src/artvenn_vision"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/artvenn_vision"]
check_untyped_defs = true
ignore_missing_imports = true


[tool.uv]
# Preserve the source runtime transitive versions for the extracted dependency closure.
constraint-dependencies = [
